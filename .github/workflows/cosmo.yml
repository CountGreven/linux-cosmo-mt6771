name: cosmo mt6771

# CI for the MT6771 mainlining work, on GitHub rather than a local runner.
# Only this branch's own files are checked; the rest of the kernel is upstream's problem.
on:
  push:
    branches: ["cosmo/**"]
  pull_request:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  dtbs:
    name: device trees compile cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu device-tree-compiler libssl-dev bc flex bison

      - name: Configure
        run: make defconfig

      # dtc warnings on our own files are failures: a quiet build is the done-condition
      # every device-tree task is measured against.
      - name: Build MediaTek device trees
        run: |
          make -j"$(nproc)" W=1 dtbs 2>&1 | tee dtbs.log
          if grep -E "arch/arm64/boot/dts/mediatek/(mt6771|.*cosmo).*(Warning|Error)" dtbs.log; then
            echo "::error::dtc complained about our device trees"
            exit 1
          fi

      # The memory map is what stands between us and a first boot: /memory, non-overlapping
      # reserved regions, and a pstore that can be read back.
      - name: Check the memory map
        run: ./ci/check-memory.py arch/arm64/boot/dts/mediatek/mt6771-planet-cosmo.dtb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediatek-dtbs
          path: arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: ignore

  notes:
    name: no private notes in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private notes in the kernel tree
        run: |
          if [ -e cosmo-notes ]; then
            echo "::error::cosmo-notes/ belongs in the private notes repo, not here"
            exit 1
          fi

  dtbs_check:
    name: device trees match their bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu device-tree-compiler libssl-dev bc flex bison python3-pip yamllint
          pip3 install --break-system-packages dtschema
      # The notes flagged this as never run: mediatek,mt6771-sysirq has no schema entry and
      # planet,cosmo needs a vendor prefix. Informational until those are fixed upstream-style.
      - name: dtbs_check
        continue-on-error: true
        run: |
          make defconfig
          make -j"$(nproc)" DT_SCHEMA_FILES=mediatek dtbs_check 2>&1 | tee dtbs_check.log
          grep -E "mt6771|cosmo" dtbs_check.log >> "$GITHUB_STEP_SUMMARY" || true

  checkpatch:
    name: patches are upstream-shaped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit this branch adds on top of mainline must survive checkpatch:
      # the work is meant to be submittable, not merely working.
      - name: checkpatch on this branch's commits
        run: |
          git remote add upstream https://github.com/torvalds/linux.git || true
          git fetch -q --depth=1 upstream master || true
          base="$(git merge-base HEAD upstream/master 2>/dev/null || echo HEAD~1)"
          git log --oneline "$base"..HEAD || true
          sudo apt-get install -y python3-ply python3-git   # spdxcheck, which checkpatch calls
          # Warnings do not fail the job: the bindings for planet,cosmo and mediatek,mt6771 are not
          # upstream yet, so every compatible we add warns until they are. Errors do fail it.
          ./scripts/checkpatch.pl --git "$base"..HEAD --no-signoff --terse | tee checkpatch.log || true
          errors=$(awk -F'[ ,]' '/^total:/ {s += $2} END {print s + 0}' checkpatch.log)
          awk '/^total:/' checkpatch.log >> "$GITHUB_STEP_SUMMARY"
          echo "checkpatch: $errors errors"
          [ "$errors" = "0" ]

  # LK loads the kernel blob into a fixed buffer; the vendor's is 11,610,550 bytes. The bring-up
  # config is packed the way the device expects and held to that size.
  image-size:
    name: bring-up kernel blob fits the vendor's size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libssl-dev bc flex bison
      - name: Build and pack
        run: |
          make allnoconfig KCONFIG_ALLCONFIG=ci/cosmo_defconfig
          make -j"$(nproc)" Image mediatek/mt6771-planet-cosmo.dtb
          python3 ci/mkbootimg-cosmo.py --image arch/arm64/boot/Image \
            --dtb arch/arm64/boot/dts/mediatek/mt6771-planet-cosmo.dtb --out boot-test.img
      - name: Check the blob size
        run: python3 ci/check-image-size.py boot-test.img

  build:
    name: kernel builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libssl-dev bc flex bison
      - name: Build Image
        run: |
          make defconfig
          make -j"$(nproc)" Image
