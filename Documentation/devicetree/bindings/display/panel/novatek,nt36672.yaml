%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt36672.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36672 based DSI display panels

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  The NT36672 is a Novatek display driver IC for MIPI DSI LCD panels. The
  initialisation sequence belongs to the panel built around it rather than to
  the IC, so each panel is described by its own compatible.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      # 6.0" 1080x2160 video mode LCD in the Planet Computers Cosmo Communicator
      - planet,cosmocom-nt36672

  reg:
    maxItems: 1

  vddi-supply:
    description: I/O voltage supply (1.8 V)

  avdd-supply:
    description: Positive analog supply for the source drivers

  avee-supply:
    description: Negative analog supply for the source drivers

  reset-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - vddi-supply
  - avdd-supply
  - avee-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "planet,cosmocom-nt36672";
            reg = <0>;

            vddi-supply = <&vio18>;
            avdd-supply = <&dsv_pos>;
            avee-supply = <&dsv_neg>;
            reset-gpios = <&pio 45 GPIO_ACTIVE_LOW>;
            backlight = <&wled>;
            rotation = <270>;

            port {
                endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
