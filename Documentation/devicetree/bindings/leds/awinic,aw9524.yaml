%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw9524.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW9523B/AW9524 in LED mode

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  The AW9523B/AW9524 16-pin I/O expanders can drive each pin as a
  constant-current LED sink with 256 dimming steps. Pins described as LED
  child nodes are switched to LED mode; P0_0..P0_7 are pins 0-7 and
  P1_0..P1_7 are pins 8-15.

properties:
  compatible:
    const: awinic,aw9524

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  awinic,led-max-microamp:
    description: Full-scale current of all LED pins.
    enum: [37000, 27750, 18500, 9250]
    default: 37000

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9a-f]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        maximum: 15
    required:
      - reg

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@5b {
            compatible = "awinic,aw9524";
            reg = <0x5b>;
            reset-gpios = <&gpio 109 GPIO_ACTIVE_LOW>;
            awinic,led-max-microamp = <18500>;
            #address-cells = <1>;
            #size-cells = <0>;

            led@0 {
                reg = <0>;
                color = <LED_COLOR_ID_RED>;
                function = LED_FUNCTION_INDICATOR;
            };
        };
    };
