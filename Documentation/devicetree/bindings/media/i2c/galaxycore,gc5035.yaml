%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc5035.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC5035 5M Pixel MIPI CSI-2 sensor

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  The GC5035 is a 2592x1944 raw Bayer image sensor with a two lane MIPI CSI-2
  interface and a CCI (I2C compatible) control bus.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc5035

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Master clock, 24 MHz.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply, 1.2 V.

  reset-gpios:
    description:
      Reference to the GPIO connected to the reset pin. Asserted holds the
      sensor in reset.
    maxItems: 1

  powerdown-gpios:
    description:
      Reference to the GPIO connected to the power down pin. Asserted powers
      the sensor down; on boards where the pin is high in operation use
      GPIO_ACTIVE_LOW.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    description:
      Output port node, single endpoint describing the CSI-2 transmitter.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - reset-gpios
  - powerdown-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@37 {
            compatible = "galaxycore,gc5035";
            reg = <0x37>;

            clocks = <&gc5035_clk>;

            reset-gpios = <&pio 102 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&pio 98 GPIO_ACTIVE_LOW>;

            dovdd-supply = <&gc5035_dovdd>;
            avdd-supply = <&gc5035_avdd>;
            dvdd-supply = <&gc5035_dvdd>;

            port {
                sensor_out: endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <438000000 219000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };

...
