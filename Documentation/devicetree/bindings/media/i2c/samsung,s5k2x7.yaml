%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k2x7.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K2X7 Image Sensor

description:
  Samsung S5K2X7 (ISOCELL 2X7) image sensor is a 24MP raw image sensor with
  a 5664x4256 pixel array. The sensor is controlled over a serial camera
  control bus protocol, data output format is RAW10 transferred over a
  4-lane MIPI D-PHY interface.

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k2x7

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock, 24 MHz.
    maxItems: 1

  reset-gpios:
    description:
      GPIO connected to the reset pad of the sensor. Asserted holds the
      sensor in reset.
    maxItems: 1

  powerdown-gpios:
    description:
      GPIO connected to the power down pad of the sensor. Asserted powers the
      sensor down; on boards where the pad is high in operation use
      GPIO_ACTIVE_LOW.
    maxItems: 1

  avdd-supply:
    description: Analogue voltage supply, 2.8 volts.

  dovdd-supply:
    description: Digital I/O voltage supply, 1.8 volts.

  dvdd-supply:
    description: Digital core voltage supply, 1.0 volts.

  afvdd-supply:
    description: Autofocus actuator voltage supply, 2.8 volts.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - powerdown-gpios
  - avdd-supply
  - dovdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k2x7";
            reg = <0x10>;
            clocks = <&camera_mclk 0>;
            assigned-clocks = <&camera_mclk 0>;
            assigned-clock-rates = <24000000>;
            reset-gpios = <&gpio1 10 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&gpio1 11 GPIO_ACTIVE_LOW>;
            avdd-supply = <&vreg_2p8>;
            dovdd-supply = <&vreg_1p8>;
            dvdd-supply = <&vreg_1p0>;
            afvdd-supply = <&vreg_af>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <798000000>;
                    remote-endpoint = <&mipi_csi2_ep>;
                };
            };
        };
    };
...
