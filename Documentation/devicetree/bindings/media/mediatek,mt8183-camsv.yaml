%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt8183-camsv.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek CAMSV raw capture unit

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  A CAMSV unit of the MediaTek MT8183 family (also MT6771) takes the stream
  of one SENINF mux and writes the raw Bayer frames to memory. The camera
  system has several units; the ones with a clock gate and an interrupt are
  described by this binding.

properties:
  compatible:
    oneOf:
      - const: mediatek,mt8183-camsv
      - items:
          - const: mediatek,mt6771-camsv
          - const: mediatek,mt8183-camsv

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: CAMSV gate in the camera system
      - description: camera core gate in the camera system
      - description: timing generator gate in the camera system

  clock-names:
    items:
      - const: camsv
      - const: cam
      - const: camtg

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1
    description: Memory port of the DMA once it is known.

  mediatek,larb:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description:
      SMI larbs to keep powered while the DMA runs, for a unit that has no
      iommus property and writes physical addresses. Dropped once the
      memory port is known.

  memory-region:
    maxItems: 1
    description:
      Contiguous memory below 4 GiB for the frame buffers of a unit that has
      no iommus property.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input from a SENINF mux.

    required:
      - port@0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt8183-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/mt8183-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        camsv@1a050000 {
            compatible = "mediatek,mt6771-camsv", "mediatek,mt8183-camsv";
            reg = <0 0x1a050000 0 0x1000>;
            interrupts = <GIC_SPI 258 IRQ_TYPE_LEVEL_LOW>;
            clocks = <&camsys CLK_CAM_CAMSV0>,
                     <&camsys CLK_CAM_CAM>,
                     <&camsys CLK_CAM_CAMTG>;
            clock-names = "camsv", "cam", "camtg";
            power-domains = <&spm MT8183_POWER_DOMAIN_CAM>;
            mediatek,larb = <&larb6>, <&larb3>;
            memory-region = <&camsv_cma>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    endpoint {
                        remote-endpoint = <&seninf_mux0>;
                    };
                };
            };
        };
    };
...
