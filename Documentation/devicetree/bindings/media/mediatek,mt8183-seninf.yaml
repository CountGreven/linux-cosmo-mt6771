%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt8183-seninf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek SENINF MIPI CSI-2 receiver

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  The SENINF block of the MediaTek MT8183 family (also MT6771) receives the
  MIPI CSI-2 streams of the camera sensors. The analog D-PHY receivers are
  separate PHY devices (mediatek,mt8365-csi-rx); SENINF has one decoder per
  CSI port and a set of muxes that route the decoded streams to the camera
  and CAMSV blocks. CSI0, CSI1 and CSI2 are 4 data lane ports; the two
  halves of CSI0 can alternatively be used as two 2 data lane ports, CSI0A
  and CSI0B.

properties:
  compatible:
    oneOf:
      - const: mediatek,mt8183-seninf
      - items:
          - const: mediatek,mt6771-seninf
          - const: mediatek,mt8183-seninf

  reg:
    maxItems: 1

  clocks:
    items:
      - description: SENINF gate in the camera system
      - description: SENINF mux in the top clock generator

  clock-names:
    items:
      - const: seninf
      - const: seninf_mux

  power-domains:
    maxItems: 1

  phys:
    minItems: 1
    maxItems: 5
    description:
      One PHY per CSI port that a sensor can be wired to, in the order of
      phy-names.

  phy-names:
    minItems: 1
    items:
      - const: csi0
      - const: csi1
      - const: csi2
      - const: csi0a
      - const: csi0b

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    patternProperties:
      '^port@[0-2]$':
        $ref: '#/$defs/csi-port'
        description:
          Input port with a 4 data lane sensor endpoint, CSI0, CSI1 or CSI2.

      '^port@[3-4]$':
        $ref: '#/$defs/csi-port'
        description:
          Input port with a 2 data lane sensor endpoint, CSI0A or CSI0B.
        properties:
          endpoint:
            type: object
            properties:
              data-lanes:
                maxItems: 2

    properties:
      port@5:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output of MUX 0.

    anyOf:
      - required:
          - port@0
      - required:
          - port@1
      - required:
          - port@2
      - required:
          - port@3
      - required:
          - port@4

$defs:
  csi-port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 4

          data-lanes:
            minItems: 1
            maxItems: 4
            items:
              enum: [1, 2, 3, 4]

        required:
          - data-lanes

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains
  - phys
  - phy-names
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt8183-clk.h>
    #include <dt-bindings/phy/phy.h>
    #include <dt-bindings/power/mt8183-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        csi@1a040000 {
            compatible = "mediatek,mt6771-seninf", "mediatek,mt8183-seninf";
            reg = <0 0x1a040000 0 0x8000>;
            clocks = <&camsys CLK_CAM_SENINF>,
                     <&topckgen CLK_TOP_MUX_SENINF>;
            clock-names = "seninf", "seninf_mux";
            power-domains = <&spm MT8183_POWER_DOMAIN_CAM>;
            phys = <&csi0_rx PHY_TYPE_DPHY 0>, <&csi1_rx>;
            phy-names = "csi0", "csi1";

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    endpoint {
                        remote-endpoint = <&main_camera_ep>;
                        bus-type = <4>;
                        data-lanes = <1 2 3 4>;
                    };
                };

                port@1 {
                    reg = <1>;

                    endpoint {
                        remote-endpoint = <&sub_camera_ep>;
                        bus-type = <4>;
                        data-lanes = <1 2>;
                    };
                };
            };
        };
    };
...
