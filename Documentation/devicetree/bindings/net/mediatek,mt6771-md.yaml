%YAML 1.2
---
$id: http://devicetree.org/schemas/net/mediatek,mt6771-md.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6771 integrated modem host interface

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description: |
  The AP side of the modem (MD1, generation 6293) built into the MediaTek
  MT6771. The AP talks to the modem through two blocks: CLDMA, a descriptor
  DMA engine split into an always-on and a power-down half, which carries
  the network queues; and CCIF, a mailbox with a 512-byte SRAM, which
  carries the boot handshake and the control channel.

  The bootloader loads and authenticates the modem firmware and describes
  what it loaded in /chosen; the operating system starts the modem and
  performs the handshake.

properties:
  compatible:
    const: mediatek,mt6771-md

  reg:
    items:
      - description: AP CLDMA, always-on half
      - description: AP CLDMA, power-down half
      - description: AP-side CCIF
      - description: MD-side CCIF
      - description: modem PLL block, written before the modem is released
      - description: modem clock switch
      - description: modem reset and watchdog block
      - description: modem boot control

  reg-names:
    items:
      - const: cldma-ao
      - const: cldma-pd
      - const: ap-ccif
      - const: md-ccif
      - const: md-pll
      - const: md-clksw
      - const: md-rgu
      - const: md-boot

  interrupts:
    items:
      - description: CLDMA queue events
      - description: CCIF channel events (handshake and ring queues)
      - description: CCIF events for the modem control path
      - description: modem watchdog

  interrupt-names:
    items:
      - const: cldma
      - const: ccif0
      - const: ccif1
      - const: wdt

  clocks:
    items:
      - description: CLDMA bus clock
      - description: CCIF0 AP side
      - description: CCIF0 MD side
      - description: CCIF1 AP side
      - description: CCIF1 MD side
      - description: CCIF2 AP side
      - description: CCIF2 MD side

  clock-names:
    items:
      - const: cldma
      - const: ccif-ap
      - const: ccif-md
      - const: ccif1-ap
      - const: ccif1-md
      - const: ccif2-ap
      - const: ccif2-md

  resets:
    items:
      - description: CLDMA always-on half
      - description: CLDMA power-down half
      - description: AP/MD CCIF

  reset-names:
    items:
      - const: cldma-ao
      - const: cldma-pd
      - const: ccif

  mediatek,scpsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The SPM, which holds the modem subsystem (MD1) power switch.

  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The bus protection between the AP and the modem, and the modem clock request.

  mediatek,topckgen:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The gates of the modem's reference clocks.

  mediatek,apmixedsys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The filter of the 26 MHz reference the modem PLLs lock to.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - mediatek,scpsys
  - mediatek,infracfg
  - mediatek,topckgen
  - mediatek,apmixedsys

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt8183-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/mt8183-resets.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        modem@10014000 {
            compatible = "mediatek,mt6771-md";
            reg = <0 0x10014000 0 0x1000>,
                  <0 0x1021b000 0 0x1000>,
                  <0 0x10209000 0 0x1000>,
                  <0 0x1020a000 0 0x1000>,
                  <0 0x20140000 0 0x1000>,
                  <0 0x20150000 0 0x1000>,
                  <0 0x200f0000 0 0x1000>,
                  <0 0x20000000 0 0x1000>;
            reg-names = "cldma-ao", "cldma-pd", "ap-ccif", "md-ccif",
                        "md-pll", "md-clksw", "md-rgu", "md-boot";
            interrupts = <GIC_SPI 173 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 151 IRQ_TYPE_LEVEL_LOW>,
                         <GIC_SPI 152 IRQ_TYPE_LEVEL_LOW>,
                         <GIC_SPI 283 IRQ_TYPE_EDGE_FALLING>;
            interrupt-names = "cldma", "ccif0", "ccif1", "wdt";
            clocks = <&infracfg CLK_INFRA_CLDMA_BCLK>,
                     <&infracfg CLK_INFRA_CCIF_AP>,
                     <&infracfg CLK_INFRA_CCIF_MD>,
                     <&infracfg CLK_INFRA_CCIF1_AP>,
                     <&infracfg CLK_INFRA_CCIF1_MD>,
                     <&infracfg CLK_INFRA_CCIF2_AP>,
                     <&infracfg CLK_INFRA_CCIF2_MD>;
            clock-names = "cldma", "ccif-ap", "ccif-md", "ccif1-ap",
                          "ccif1-md", "ccif2-ap", "ccif2-md";
            resets = <&infracfg MT8183_INFRACFG_AO_CLDMA_AO_SW_RST>,
                     <&infracfg MT8183_INFRACFG_AO_CLDMA_SW_RST>,
                     <&infracfg MT8183_INFRACFG_AO_AP_MD_CCIF_SW_RST>;
            reset-names = "cldma-ao", "cldma-pd", "ccif";
            mediatek,scpsys = <&scpsys>;
            mediatek,infracfg = <&infracfg>;
            mediatek,topckgen = <&topckgen>;
            mediatek,apmixedsys = <&apmixedsys>;
        };
    };
