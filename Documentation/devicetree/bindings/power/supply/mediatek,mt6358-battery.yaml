%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/mediatek,mt6358-battery.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6358 fuel gauge

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  Coulomb counter and current sense of the MT6358 PMIC, a child of the PMIC
  node. The state of charge is estimated from the monitored battery's OCV
  table and then followed with the coulomb counter.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: mediatek,mt6358-battery

  io-channels:
    maxItems: 1

  io-channel-names:
    const: vbat

  monitored-battery: true

required:
  - compatible
  - io-channels
  - io-channel-names
  - monitored-battery

unevaluatedProperties: false

examples:
  - |
    battery {
        compatible = "mediatek,mt6358-battery";
        io-channels = <&pmic_adc 0>;
        io-channel-names = "vbat";
        monitored-battery = <&bat>;
    };
