%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6771-sleep.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6771 SPM deep sleep

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  System suspend support for MT6771. The kernel notifies the SSPM firmware through mailbox 1
  before and after suspend, and arms the SPM suspend firmware through the trusted firmware.
  The node names that mailbox, the SPM register block and the PMIC whose rail low-power
  modes the SPM firmware relies on.

properties:
  compatible:
    const: mediatek,mt6771-sleep

  reg:
    items:
      - description: SSPM mailbox 1 data
      - description: SSPM mailbox 1 interrupt control

  reg-names:
    items:
      - const: mbox
      - const: mbox-ctrl

  mediatek,spm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The SPM (scpsys) syscon

  mediatek,pmic:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The MT6358 PMIC

required:
  - compatible
  - reg
  - reg-names
  - mediatek,spm
  - mediatek,pmic

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sleep@10460000 {
            compatible = "mediatek,mt6771-sleep";
            reg = <0 0x10460000 0 0x100>, <0 0x10461000 0 0x8>;
            reg-names = "mbox", "mbox-ctrl";
            mediatek,spm = <&scpsys>;
            mediatek,pmic = <&pmic>;
        };
    };
