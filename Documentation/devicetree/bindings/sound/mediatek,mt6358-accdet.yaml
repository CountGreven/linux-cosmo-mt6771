%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6358-accdet.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6358 accessory detection

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  Headset jack and button detection block of the MT6358 PMIC, a child of the
  PMIC node. The plug is reported by the ACCDET EINT0 line, the plug type and
  button presses by the ACCDET comparator, and the buttons are told apart by
  the AUXADC ACCDET channel.

properties:
  compatible:
    const: mediatek,mt6358-accdet

  io-channels:
    maxItems: 1

  io-channel-names:
    const: accdet

  mediatek,mic-vol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: MICBIAS1 voltage selector, AUDENC_ANA_CON10 bits 6:4.
    maximum: 7

  mediatek,eint-level-pol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Plug-in level of the EINT line, an IRQ_TYPE_LEVEL_* value.
    enum: [4, 8]

  mediatek,pwm-deb-setting:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      PWM width, PWM threshold, fall delay, rise delay, then the debounce
      times of comparator states 00, 01 and 11 and of the AUXADC.
    minItems: 8
    maxItems: 8

  mediatek,three-key-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      Button voltage boundaries in mV; the first cell is unused, then the
      upper limits of play/pause, volume up and volume down.
    minItems: 4
    maxItems: 4

required:
  - compatible
  - io-channels
  - io-channel-names
  - mediatek,pwm-deb-setting
  - mediatek,three-key-thr

additionalProperties: false

examples:
  - |
    accdet {
        compatible = "mediatek,mt6358-accdet";
        io-channels = <&pmic_adc 4>;
        io-channel-names = "accdet";
        mediatek,mic-vol = <6>;
        mediatek,eint-level-pol = <8>;
        mediatek,pwm-deb-setting = <0x500 0x500 1 0x1f0 0x800 0x800 0x20 0x44>;
        mediatek,three-key-thr = <0 80 220 400>;
    };
