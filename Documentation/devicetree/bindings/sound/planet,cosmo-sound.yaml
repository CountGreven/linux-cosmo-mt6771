%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/planet,cosmo-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Planet Cosmo Communicator sound card

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

description:
  MT6771 audio front end with the MT6358 codec. The speakers are driven from
  the codec headphone buffer through GPIO amplifiers, and the earpiece path
  has a GPIO switch.

properties:
  compatible:
    const: planet,cosmo-sound

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The audio front end.

  mediatek,accdet:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The MT6358 accessory detection block, for the headset jack.

  aux-devs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description:
      Amplifiers and switches on the codec outputs. Their sound-name-prefix
      must be "Amp1" and "Amp2" for the speaker amplifiers and
      "Earpiece Switch" for the earpiece switch.

  pinctrl-names:
    const: default

  pinctrl-0:
    maxItems: 1

required:
  - compatible
  - mediatek,platform

additionalProperties: false

examples:
  - |
    sound {
        compatible = "planet,cosmo-sound";
        mediatek,platform = <&afe>;
        aux-devs = <&amp1>, <&amp2>, <&earpiece_switch>;
    };
