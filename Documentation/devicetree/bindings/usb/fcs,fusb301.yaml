%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/fcs,fusb301.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fairchild FUSB301 Type-C port controller

description:
  The Fairchild (onsemi) FUSB301 is a USB Type-C port controller which
  supports role and plug orientation detection using the CC pins. It is
  compatible with the USB Type-C Cable and Connector Specification v1.2.

maintainers:
  - Fredrik Lindlöf <fredrik.lindlof@gmail.com>

properties:
  compatible:
    enum:
      - fcs,fusb301

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vbus-supply:
    description:
      Regulator that provides VBUS when the port is a source. Omit it when
      VBUS is switched by other hardware.

  fcs,vbus-on-unless-source:
    type: boolean
    description:
      Keep vbus-supply enabled while no partner or a sink partner is
      attached, and release it only while a source partner is attached. For
      a rail that also feeds other loads on the board. The partner type is
      polled, since a source partner may not raise an interrupt.

  hdmi-detect-gpios:
    maxItems: 1
    description:
      Input that an HDMI adapter drives active once VBUS is up. It is read
      400 ms after a sink partner attaches; while it is active the port takes
      no USB data role.

  source-notify-gpios:
    maxItems: 1
    description:
      Output driven active while a source partner (charger or host) is
      attached, for a companion controller.

  connector:
    type: object
    $ref: ../connector/usb-connector.yaml#
    unevaluatedProperties: false
    description:
      The managed USB Type-C connector. Since FUSB301 does not support
      Power Delivery, the node should have the "pd-disable" property. A
      graph link from port@0 to a USB role switch lets the driver switch
      the controller to host when a sink is attached.

    properties:
      compatible:
        const: usb-c-connector

    required:
      - pd-disable

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      tcpc@25 {
        compatible = "fcs,fusb301";
        reg = <0x25>;
        interrupt-parent = <&gpio0>;
        interrupts = <4 IRQ_TYPE_LEVEL_LOW>;
        vbus-supply = <&otg_switch>;
        fcs,vbus-on-unless-source;
        hdmi-detect-gpios = <&gpio0 54 GPIO_ACTIVE_HIGH>;
        source-notify-gpios = <&gpio0 52 GPIO_ACTIVE_HIGH>;

        connector {
          compatible = "usb-c-connector";
          label = "USB-C";
          power-role = "dual";
          try-power-role = "sink";
          data-role = "dual";
          typec-power-opmode = "default";
          pd-disable;
        };
      };
    };
